{% extends 'base.html' %}

{% block main %}

<a class="btn btn-primary" href="{% url 'create_departamento' %}">Novo</a>

<ul>
    {% for departamento in object_list %}
        <li>
            <a href="{% url 'update_departamento' departamento.id %}">{{ departamento.nome }}</a>
            <a class="btn btn-danger" href="{% url 'delete_departamento' departamento.id %}">Excluir</a>
        </li>
    {% endfor %}
</ul>

{% endblock %}
