{% extends 'base.html' %}

{% block main %}

<a class="btn btn-primary" href="{% url 'create_hora_extra' %}">Novo</a>

<ul>
    {% for hora_extra in object_list %}
        <li>
            <a href="{% url 'update_hora_extra' hora_extra.id %}">{{ hora_extra.motivo }}</a>
            <a class="btn btn-danger" href="{% url 'delete_hora_extra' hora_extra.id %}">Excluir</a>
        </li>
    {% endfor %}
</ul>

{% endblock %}
