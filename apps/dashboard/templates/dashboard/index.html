{% extends 'base.html' %}

{% block main %}
   <div class="row">
    <div class="col-sm">
      Olá, {{ usuario.funcionario.nome }}
    </div>
    <div class="col-sm">
      <a href="{% url 'list_funcionarios' %}">Gerenciar funcionarios</a>
      <a href="{% url 'list_departamentos' %}">Gerenciar departamentos</a>
    </div>
    <div class="col-sm">
        <form method="post" action="{% url 'logout' %}" style="display:inline;">
            {% csrf_token %}
            <button type="submit" class="btn btn-link">Logout</button>
        </form>

        {% if usuario.funcionario.empresa %}
          <a href="{% url 'update_empresa' usuario.funcionario.empresa.id %}">Editar empresa</a>
        {% else %}
          <a href="{% url 'create_empresa' %}">Criar empresa</a>
        {% endif %}
    </div>
  </div>
{% endblock %}
