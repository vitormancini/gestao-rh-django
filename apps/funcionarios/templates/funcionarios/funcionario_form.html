{% extends 'base.html' %}

{% block main %}
<form method="post">
    {% csrf_token %}
    {{ form }}
    <button type="submit">Salvar</button>
</form>

<a href="{% url 'create_documento' object.id %}" class="btn btn-info">Adicionar documento</a>

<br/>
<br/>

{% for documento in object.documento_set.all %}
    <a href="{{ documento.arquivo.url }}">{{ documento }}</a>
    <br/>
{% endfor %}
{% endblock %}
